name: Build Executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyinstaller yfinance pandas requests
      - name: Build
        run: |
          pyinstaller --onefile \
            --name stock-heatmap-linux \
            --hidden-import yfinance \
            --hidden-import pandas \
            --hidden-import requests \
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-heatmap-linux
          path: dist/stock-heatmap-linux

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyinstaller yfinance pandas requests
      - name: Build
        run: |
          pyinstaller --onefile --windowed `
            --name stock-heatmap-windows `
            --hidden-import yfinance `
            --hidden-import pandas `
            --hidden-import requests `
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-heatmap-windows
          path: dist/stock-heatmap-windows.exe

  build-macos:
    name: Build on macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyinstaller yfinance pandas requests
      - name: Build
        run: |
          pyinstaller --onefile \
            --name stock-heatmap-macos \
            --hidden-import yfinance \
            --hidden-import pandas \
            --hidden-import requests \
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-heatmap-macos
          path: dist/stock-heatmap-macos

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}

            Download the binary for your platform:
            - 🐧 **Linux x86_64**: `stock-heatmap-linux`
            - 🪟 **Windows x86_64**: `stock-heatmap-windows.exe`
            - 🍎 **macOS arm64** (Apple Silicon M1/M2/M3): `stock-heatmap-macos`

            > Note: Intel Mac binaries are no longer available as GitHub retired free Intel macOS runners in Dec 2025.
          files: |
            dist/stock-heatmap-linux/stock-heatmap-linux
            dist/stock-heatmap-windows/stock-heatmap-windows.exe
            dist/stock-heatmap-macos/stock-heatmap-macos
          draft: false
          prerelease: false
